services:
  livekit-token:
    image: node:20-bookworm-slim
    container_name: motoamg-livekit-token
    working_dir: /app
    volumes:
      - ./:/app
      - ./serviceAccount.json:/secrets/serviceAccount.json:ro
    environment:
      PORT: "7882"
      LIVEKIT_URL: wss://livekit.albertomaestre.es
      LIVEKIT_API_KEY: motoamg
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/serviceAccount.json
    command: ["bash", "-lc", "npm ci --omit=dev && node server.js"]
    network_mode: host
    restart: unless-stopped
