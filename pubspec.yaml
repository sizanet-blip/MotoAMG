name: moto_amg
description: "MotoAMG — Pelotón en vivo y GPS para moteros. Salidas en grupo, ubicación del pack, rutas e intercom."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_database: ^11.3.10
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7
  json_annotation: ^4.12.0
  google_sign_in: ^6.3.0
  geolocator: ^13.0.4
  permission_handler: ^11.4.0
  crypto: ^3.0.6
  http: ^1.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_tts: ^4.2.3
  maplibre_gl: ^0.27.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  file_picker: ^12.1.1
  wakelock_plus: ^1.7.0
  screen_brightness: ^2.1.11
  url_launcher: ^6.3.2
  firebase_crashlytics: ^4.3.10
  package_info_plus: ^10.2.1
  qr_flutter: ^4.1.0
  livekit_client: ^2.5.3
  google_fonts: ^8.2.1
  web_socket_channel: ^3.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/motoamg-app-icon.png
  adaptive_icon_background: "#1A1D21"
  adaptive_icon_foreground: assets/branding/motoamg-app-icon.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/motoamg-app-icon.png
    - assets/branding/motoamg-wordmark.png
    - assets/branding/motoamg-home-landscape.png
    - assets/maps/navigation_style.json
    - assets/maps/protomaps_light_layers.json
    - assets/maps/basemaps/fonts/Noto Sans Regular/
    - assets/maps/basemaps/fonts/Noto Sans Medium/
    - assets/maps/basemaps/fonts/Noto Sans Italic/
    - assets/maps/basemaps/fonts/Noto Sans Devanagari Regular v1/
    - assets/maps/basemaps/sprites/v4/
